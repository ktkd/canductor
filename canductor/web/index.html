<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CANDuctor — CAN data collection</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --primary: #0d47a1;
  --border: #ddd;
  --zebra: #f5f7fa;
  --hover: #e3f2fd;
  --highlight: #fff3e0;
  --good: #2e7d32;   --good-bg: #c8e6c9;
  --warn: #ef6c00;   --warn-bg: #ffe0b2;
  --bad:  #c62828;   --bad-bg:  #ffcdd2;
  --yellow: #f57f17; --yellow-bg: #fff9c4;
  --muted: #666;
  --code-bg: #f5f7fa;
  --mono: Consolas, 'DejaVu Sans Mono', monospace;
}
* { box-sizing: border-box; }
html { height: 100%; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 11px; color: var(--fg); background: var(--bg);
  margin: 0; padding: 12px 16px; line-height: 1.4; min-height: 100%;
}
/* slim scrollbars everywhere (WebKit + FF) */
* { scrollbar-width: thin; scrollbar-color: #cfd8dc transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: #cfd8dc; border-radius: 4px; }
*::-webkit-scrollbar-thumb:hover { background: #90a4ae; }
h1 { font-size: 20px; margin: 0; color: var(--primary); font-weight: 600; }
h2 { font-size: 15px; margin: 0 0 8px; color: var(--primary); font-weight: 600;
     border-bottom: 2px solid var(--primary); padding-bottom: 4px; }
h3 { font-size: 13px; margin: 16px 0 6px; color: #333; }
a { color: var(--primary); }
table { width: 100%; border-collapse: collapse; margin: 0; background: #fff; font-size: 10.5px; }
th {
  background: var(--primary); color: #fff; padding: 5px 8px; text-align: left;
  font-weight: 600; border: 1px solid var(--primary); font-size: 10px;
}
td { padding: 4px 8px; border: 1px solid var(--border); vertical-align: top; }
tr:nth-child(even) td { background: var(--zebra); }
tbody tr:hover td { background: var(--hover); }
code {
  background: var(--code-bg); padding: 1px 5px; border-radius: 3px;
  font-family: var(--mono); color: var(--primary); font-size: 9.5px;
}
pre {
  background: var(--code-bg); padding: 12px; border-radius: 4px; overflow: auto;
  border-left: 4px solid var(--primary); margin: 0;
  font-family: var(--mono); font-size: 10px; white-space: pre-wrap; word-break: break-all; color: var(--fg);
}
.mono { font-family: var(--mono); }
.small { font-size: 10px; }
.muted { color: var(--muted); }
.bad { color: var(--bad); font-weight: 600; }
.good { color: var(--good); font-weight: 600; }
.warning { background: var(--warn-bg); border-left: 4px solid var(--warn); padding: 9px 12px; margin: 8px 0; border-radius: 0 4px 4px 0; }
.critical { background: var(--bad-bg); border-left: 4px solid var(--bad); padding: 9px 12px; margin: 8px 0; border-radius: 0 4px 4px 0; }
.success { background: var(--good-bg); border-left: 4px solid var(--good); padding: 9px 12px; margin: 8px 0; border-radius: 0 4px 4px 0; }
.info { background: var(--hover); border-left: 4px solid var(--primary); padding: 9px 12px; margin: 8px 0; border-radius: 0 4px 4px 0; }
.badge {
  display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 9.5px;
  font-weight: 600; margin-right: 4px; background: var(--zebra); color: #333; border: 1px solid var(--border);
}
.badge-hs { background: var(--primary); color: #fff; border-color: var(--primary); }
.badge-ms { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow); }
.badge-critical { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.badge-verify { background: var(--good-bg); color: var(--good); border-color: var(--good); }

#topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
#topline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.st-badge {
  display: inline-block; padding: 3px 10px; border-radius: 11px; font-size: 9.5px;
  font-weight: 600; border: 1px solid var(--border); background: var(--zebra); color: var(--muted);
}
.st-run { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.st-rec { background: var(--good-bg); color: var(--good); border-color: var(--good); animation: pulse 1.2s infinite; }
.st-paused { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow); }
.st-done { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.st-error { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.45; } 100% { opacity: 1; } }
.chip {
  display: inline-flex; align-items: center; gap: 7px; background: #fff;
  border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 9.5px;
}
.chip-state { color: var(--muted); }
.chip-state.ok { color: var(--good); font-weight: 600; }
.chip-state.err { color: var(--bad); font-weight: 600; }
/* app layout: steps + work fill the browser window */
#main {
  display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 12px;
  height: calc(100vh - 62px); min-height: 480px;
}
.panel { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin: 0; }
#steps { overflow-y: auto; min-height: 0; }
.step {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 6px; padding: 5px 7px; margin: 2px 0;
  border: 1px solid transparent; border-left: 3px solid var(--border); border-radius: 3px; font-size: 10.5px;
}
.step:hover { background: var(--hover); }
.step-cur { border-left-color: var(--primary); background: var(--highlight); }
.step-done { opacity: 0.6; }
.step-skip { opacity: 0.45; }
.step-id { font-family: var(--mono); color: var(--primary); font-weight: 700; font-size: 10px; min-width: 42px; }
.step-title { flex: 0 0 100%; margin-top: 3px; overflow-wrap: anywhere; }
.step-meta { flex: 1 1 auto; min-width: 0; display: inline; font-size: 9.5px; color: var(--muted); white-space: normal; }
.step-mark { width: 13px; text-align: center; font-weight: 700; }
.step-done .step-mark { color: var(--good); }
.step-skip .step-mark { color: var(--muted); }
.step-cur .step-mark { color: var(--primary); }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
.card-head h2 { margin: 0; border: none; padding: 0; font-size: 14px; flex: 1; }
.card-do { margin: 7px 0; }
.kv { margin: 5px 0; font-size: 10.5px; }
.kv b { color: var(--primary); font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 3px; margin: 8px 0; min-width: 118px; font-size: 10.5px; }
.field label { font-size: 9.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
input, select, textarea {
  background: #fff; color: var(--fg); border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 8px; font-family: inherit; font-size: 10.5px;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background: var(--hover); }
textarea { resize: vertical; min-height: 48px; }
.form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.btn {
  display: inline-block; background: #fff; color: var(--fg); border: 1px solid var(--border);
  border-radius: 4px; padding: 5px 12px; font-size: 10.5px; cursor: pointer; font-family: inherit; font-weight: 600;
}
.btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--hover); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-go { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-go:hover:not(:disabled) { background: #1565c0; color: #fff; }
.btn-quit { border-color: var(--bad); color: var(--bad); }
.btn-sm { padding: 3px 9px; font-size: 9.5px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.err-box { margin-top: 8px; }

#rightcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
#phasebar { flex: none; }
#phasebar:empty { display: none; }
.phase-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 10.5px; }
.phase-box .cd { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--good); min-width: 48px; }
.rec-dot { color: var(--good); animation: pulse 1.2s infinite; font-weight: 700; }
#panel { flex: 0 1 auto; overflow-y: auto; max-height: 55%; min-height: 118px; }
/* HS + MS side by side; fixed height inside the viewport, no stretch from content */
#live { flex: 1 1 0; min-height: 260px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 10px; margin: 0; }
.live-panel { margin: 0; padding: 8px 10px; display: flex; flex-direction: column; min-width: 0; min-height: 0; border-left: 3px solid var(--border); }
.live-panel.hl { border-left-color: var(--primary); background: var(--highlight); }
.live-head { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; flex: none; }
.live-head .lstat { margin-left: auto; color: var(--muted); font-size: 9.5px; }
.live-head .muted { font-size: 9.5px; }
.lopen { display: none; }
.lopen.show { display: inline-block; }
.lrows { width: 52px; font-family: var(--mono); font-size: 9.5px; padding: 2px 4px; text-align: right; }
/* TX: one-shot send + saved quick list */
.txrow { display: flex; flex-wrap: wrap; gap: 5px; flex: none; margin-top: 6px; }
.tx-in { font-family: var(--mono); font-size: 9.5px; padding: 3px 6px; width: 90px; }
.tx-in-data { flex: 1; min-width: 104px; width: auto; }
.txfill { font-size: 9.5px; color: var(--good); font-weight: 600; }
.txfill.err { color: var(--bad); }
.txpresets { flex: none; margin-top: 5px; display: flex; flex-direction: column; gap: 3px; font-size: 9.5px; max-height: 62px; overflow-y: auto; }
.txpre { display: flex; align-items: center; gap: 5px; }
.txpre .mono { color: var(--primary); }
.btn-xs { padding: 1px 6px; font-size: 9px; }
.live-scroll { flex: 1 1 0; min-height: 96px; overflow: auto; border: 1px solid var(--border); border-radius: 4px; background: #fff; margin-top: 6px; }
.live-table { margin: 0; font-size: 9.5px; }
.live-table th { padding: 3px 7px; font-size: 9px; border: none; border-bottom: 1px solid var(--border); }
.live-table td { padding: 2px 7px; border: none; border-bottom: 1px solid #eee; white-space: nowrap; font-family: var(--mono); font-size: 9.5px; }
.live-table td.t-data { color: #1565c0; }
.nolink { display: none; margin-top: 5px; color: var(--muted); font-size: 9.5px; flex: none; }
.nolink.show { display: block; }
#logs { margin-top: 12px; }
#logs details { border: 1px solid var(--border); border-radius: 5px; margin-bottom: 6px; background: #fff; }
#logs summary { cursor: pointer; padding: 7px 11px; display: flex; gap: 10px; align-items: baseline; font-size: 10.5px; }
#logs summary:hover { background: var(--hover); }
.ls-name { color: var(--primary); font-weight: 600; }
.log-table { margin: 0 10px 10px; }
.file-link { margin-right: 4px; text-decoration: none; border-bottom: 1px dashed var(--primary); }
.file-link:hover { background: var(--highlight); }
.dl { margin: 0 9px 0 4px; font-size: 9.5px; }
#modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); display: none; z-index: 50; }
#modal.open { display: block; }
.modal-box {
  position: absolute; top: 4vh; left: 50%; transform: translateX(-50%);
  width: min(920px, 94vw); height: 88vh; background: #fff;
  border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
}
.modal-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 11px; }
.modal-head .mtitle { flex: 1; font-weight: 600; word-break: break-all; color: var(--primary); }
#modal-body { flex: 1; overflow: auto; background: #fff; color: var(--fg); border-left: none; }
#modal-body.critical { background: var(--bad-bg); color: var(--bad); }
.footer { margin: 0; padding: 10px 0 4px; border-top: 1px solid var(--border); color: #888; font-size: 9.5px; text-align: center; }
@media (max-width: 900px) {
  #main { grid-template-columns: 1fr; height: auto; min-height: 0; }
  #steps { max-height: 40vh; }
  #panel { max-height: none; }
  #live { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header id="topbar">
  <h1>CANDuctor — CAN data collection</h1>
  <div id="topline">
    <span id="sess-badge" class="st-badge st-idle">idle</span>
    <span id="devchips"></span>
  </div>
</header>
<div id="main">
  <aside id="steps" class="panel">
    <h2 id="steps-h">Scenario:</h2>
    <div id="steps-list"><div class="muted small">Loading…</div></div>
  </aside>
  <div id="rightcol">
    <section id="phasebar" class="panel"></section>
    <section id="panel" class="panel"><div class="muted small">Loading…</div></section>
    <section id="live"></section>
  </div>
</div>
<section id="logs" class="panel">
  <h2>Collected data</h2>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
    <button id="logs-refresh" class="btn btn-sm">↻ Refresh</button>
    <span id="logs-new" class="muted small" style="display:none">new recordings — scroll or refresh</span>
    <span id="logs-root" class="muted small mono"></span>
  </div>
  <div id="logs-body"><div class="muted small">Loading…</div></div>
</section>
<div id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="mtitle mono" id="modal-title"></span>
      <button id="modal-close" class="btn btn-sm" title="Close">×</button>
    </div>
    <pre id="modal-body"></pre>
  </div>
</div>
<footer class="footer">CANDuctor web UI · link: <a class="mono" href="https://canductor.ktkd.ru" target="_blank" rel="noopener">canductor.ktkd.ru</a></footer>
</body>
<script>
'use strict';
// --- last-seen session count for the "new recordings" hint ------------------
let _lastSessionCount = -1;

const API = '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = {
  scenarios: [], scenName: '', scen: null,
  ses: null,
  live: {},   // alias -> {rows,total,unique:Set,fps:[],paused}
  conn: {},   // alias -> EventSource
  stream: null,
  pollT: null,
  tickT: null,
  skipped: new Map(),
  busy: false,
  lastPanel: null,   // {type, key} — what was rendered last, for in-flight form carry-over
};

// --- api ------------------------------------------------------------------
async function jreq(u, o = {}) {
  const r = await fetch(API + u, o);
  let j = null;
  try { j = await r.json(); } catch (e) { throw new Error('HTTP ' + r.status + ' (not JSON)'); }
  if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
  return j;
}
const post = (u, b) => jreq(u, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b) });

// --- live ring buffer: configurable max rows per bus (localStorage, default 100) ----
const LIVE_ROWS_DEFAULT = 100;
const LIVE_THROTTLE_MS = 100;   // display stream window (server-side decimation)
function maxRows(alias) {
  try {
    const v = parseInt(localStorage.getItem('canductor.rows.' + alias) || '', 10);
    if (v >= 10 && v <= 1000) return v;
  } catch (_) {}
  return LIVE_ROWS_DEFAULT;
}
function setMaxRows(alias, n) {
  n = Math.max(10, Math.min(1000, Math.round(Number(n) || LIVE_ROWS_DEFAULT)));
  try { localStorage.setItem('canductor.rows.' + alias, String(n)); } catch (_) {}
  const inp = $('lrlim-' + alias); if (inp) inp.value = n;
  const L = state.live[alias];
  if (L) {
    const cap = n * 3 + 20;
    while (L.rows.length > cap) L.rows.shift();
    L.dirty = true;   // table rebuilds on the next flush
  }
}

// --- live display: pushFrame = cheap buffering only; the DOM is rebuilt once per
//     ~100 ms flush (below), not per SSE message. A real bus is ~100-400 msg/s:
//     per-message DOM work (rebuild + reflow) used to saturate the tab's main
//     thread, which froze the page and made the live panels look dead.          ---
function pushFrame(alias, f) {
  const L = state.live[alias] || (state.live[alias] = { rows: [], total: 0, unique: new Set(), fps: [], paused: false, dirty: false });
  // payload: a single frame (legacy stream) or a throttle batch {total, frames[]}
  let n = 1,
      frs = [f];
  if (Array.isArray(f.frames)) { n = f.total | 0; frs = f.frames; }
  L.total += n;
  L.fps.push({ t: Date.now(), n: n });
  if (L.fps.length > 600) L.fps.shift();
  for (const fr of frs) L.unique.add(fr.id);
  if (L.paused || !frs.length) return;
  for (const fr of frs) L.rows.push(fr);
  const cap = maxRows(alias) * 3 + 20;
  while (L.rows.length > cap) L.rows.shift();
  L.dirty = true;
}
function flushLive() {
  for (const a of Object.keys(state.live)) {
    const L = state.live[a];
    if (L && L.dirty) {
      L.dirty = false;
      renderLiveTable(a);
    }
  }
}
(function liveLoop() {
  let last = 0;
  const tick = (now) => {
    if (now - last >= LIVE_THROTTLE_MS) {   // rAF pauses on a hidden tab → no DOM work there
      last = now;
      flushLive();
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
function renderLiveTable(alias) {
  const L = state.live[alias];
  const tb = $('lrows-' + alias);
  if (!L || !tb) return;
  const sc = $('lscroll-' + alias);
  const atBottom = sc ? (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 8) : true;
  const tail = L.rows.slice(-maxRows(alias));
  tb.innerHTML = tail.map((f) =>
    '<tr><td>' + fmtTimeMs(f.ts) + '</td><td>0x' + esc(f.id_hex) + '</td><td>' + esc(f.dlc) + '</td><td class="t-data">' + esc(hexGroups(f.data)) + '</td></tr>'
  ).join('');
  if (atBottom && sc) sc.scrollTop = sc.scrollHeight;
}
function updateLiveStats(alias) {
  const L = state.live[alias]; const el = $('lstat-' + alias);
  if (!L || !el) return;
  const now = Date.now();
  while (L.fps.length && now - L.fps[0].t > 1000) L.fps.shift();
  let fps = 0;
  for (const e of L.fps) fps += e.n;
  el.textContent = 'frames ' + L.total + ' · ID ' + L.unique.size + ' · ~' + fps + ' fps' + (L.paused ? ' · PAUSED' : '');
}
function toggleLivePause(alias) {
  const L = state.live[alias] || (state.live[alias] = { rows: [], total: 0, unique: new Set(), fps: [], paused: false, dirty: false });
  L.paused = !L.paused;
  const b = $('lbtn-' + alias); if (b) b.textContent = L.paused ? '▶ continue' : '⏸ pause';
  if (!L.paused) L.dirty = true;   // one table rebuild on the next flush (no per-row reflow)
  updateLiveStats(alias);
}

// --- fmt ------------------------------------------------------------------
function fmtTimeMs(ts) { const d = new Date(ts * 1000); return d.toTimeString().slice(0, 8) + '.' + String(Math.floor(d.getMilliseconds())).padStart(3, '0'); }
function hexGroups(h) { return String(h || '').replace(/(.{2})/g, '$1 ').trim(); }
function fmtSize(n) { n = Number(n) || 0; if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(2) + ' MB'; }
function fmtBaud(b) { return b ? Math.round(b / 1000) + ' kbit/s' : ''; }

// --- rsync / SSE --------------------------------------------------------------
async function sync() {
  try {
    state.ses = await jreq('/api/session/status');
    if (!Object.keys(state.conn).length && Object.keys((state.ses && state.ses.devices) || {}).length)
      buildLivePanes();
    renderAll(state.ses);
  } catch (e) { console.warn('sync:', e); }
}
function openStream() {
  if (state.stream) { try { state.stream.close(); } catch (e) {} }
  const es = new EventSource(API + '/api/session/stream');
  es.onmessage = (m) => {
    let e; try { e = JSON.parse(m.data); } catch (err) { return; }
    handleEvent(e);
  };
  es.onopen = () => { sync(); refreshLogs(); };   // rsync on every (re)connect
  es.onerror = () => { /* EventSource reconnects by itself */ };
  state.stream = es;
}
function handleEvent(e) {
  if (!e || !e.type) return;
  const s = state.ses || {
    session_state: 'idle', plan: [], summary: {}, card: null, phase: null, done: [], last_error: ''
  };
  switch (e.type) {
    case 'status':
      state.ses = Object.assign({}, s, e.state || {});  // e.state has no devices — keep the old ones
      renderAll(state.ses); break;
    case 'session_start':
      state.ses = {...s, session_state: 'running', plan: e.plan || [], summary: e.summary || {}, done: [], card: null, phase: null};
      state.skipped.clear(); renderAll(state.ses); refreshLogs();
      if (e.summary && e.summary.scenario && e.summary.scenario !== state.scenName) loadScenario(e.summary.scenario);
      break;
    case 'card':
      state.ses = {...s, session_state: 'waiting', card: e.card, phase: null}; renderAll(state.ses); break;
    case 'phase':
      state.ses = {...s, session_state: 'recording', phase: {test_id: e.test_id, car: e.car, name: e.phase, until: e.until, dur: e.dur}};
      renderAll(state.ses); break;
    case 'pause':
      state.ses = {...s, session_state: 'paused', phase: null, pauseDur: e.dur || 0, pauseUntil: e.until || 0}; renderAll(state.ses); break;
    case 'done':

      + '<button class="btn btn-xs btn-go" id="txsend-' + esc(a) + '">Send</button>'
      + '<button class="btn btn-xs" id="txsave-' + esc(a) + '">+ save</button>'
      + '<span class="txfill" id="txf-' + esc(a) + '"></span>'
      + '</div>'
      + '<div class="txpresets" id="txp-' + esc(a) + '"></div>'
      + '<div class="live-scroll" id="lscroll-' + esc(a) + '">'
      + '<table class="live-table"><thead><tr><th>time</th><th>ID</th><th>DLC</th><th>data</th></tr></thead>'
      + '<tbody id="lrows-' + esc(a) + '"></tbody></table></div>'
      + '<div class="nolink' + (d.state === 'init' ? ' show' : '') + '" id="lnolink-' + esc(a) + '">no link (bus: ' + esc(d.state || '?') + ' — stream appears after configure/open)</div>'
      + '</section>');
    const btn = $('lbtn-' + a); if (btn) btn.addEventListener('click', () => toggleLivePause(a));
    const inp = $('lrlim-' + a);
    if (inp) inp.addEventListener('change', () => setMaxRows(a, parseInt(inp.value, 10)));
    const op = $('lopen-' + a); if (op) op.addEventListener('click', () => txOpenDevice(a));
    const sd = $('txsend-' + a); if (sd) sd.addEventListener('click', () => txFromInputs(a));
    const sv = $('txsave-' + a); if (sv) sv.addEventListener('click', () => txAddPreset(a));
    ['txid', 'txdata'].forEach((k) => {
      const el = $(k + '-' + a);
      if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') txFromInputs(a); });
    });
    if (!state.live[a]) state.live[a] = { rows: [], total: 0, unique: new Set(), fps: [], paused: false, dirty: false };
    updateLiveStats(a);
    renderTxPresets(a);
    openDevice(a);
  });
}
function renderLiveHighlight(s) {
  Object.keys(state.live).forEach((a) => {
    const el = $('live-' + a); if (!el) return;
    const stInit = !!(s.devices && s.devices[a] && s.devices[a].state === 'init');
    const active = s.session_state === 'recording' && s.card && (s.card.buses || []).indexOf(a) >= 0;
    el.classList.toggle('hl', active);
    const nl = $('lnolink-' + a);
    if (nl) nl.classList.toggle('show', stInit);
    const op = $('lopen-' + a);
    if (op) op.classList.toggle('show', stInit);
  });
}
function renderPhaseBar(s) {
  const el = $('phasebar'); if (!el) return;
  const rec = s.session_state === 'recording' && s.phase;
  const pause = s.session_state === 'paused';
  if (state._cd) { clearInterval(state._cd.timer); state._cd = null; }
  if (!rec && !pause) { el.innerHTML = ''; return; }
  let html = '<div class="phase-box">';
  if (rec) {
    const p = s.phase;
    html += '<span class="rec-dot">●</span>'
      + '<span class="badge badge-critical">REC</span>'
      + '<span>Phase: <b>' + esc(p.name) + '</b></span>'
      + '<span class="muted small">Current: ' + esc(p.test_id) + ' · car=' + esc(p.car) + '</span>'
      + '<span class="cd" id="cd" title="time left">--s</span>';
  } else {
    html += '<span class="badge" style="background:var(--warn);color:#000">PAUSE</span>'
      + '<span>pause between tests</span><span class="cd" id="cd">--s</span>';
  }
  html += '<span class="muted small">cmd during phase — queued until the next card</span></div>';
  el.innerHTML = html;
  const target = rec ? (s.phase.until || 0) : ((s.pauseUntil || 0) ? s.pauseUntil : (Date.now() / 1000 + (s.pauseDur || 0)));
  const kind = rec ? 'rec' : 'pause';
  const cd = { kind, target, timer: null };
  state._cd = cd;
  const tick = () => {
    const node = $('cd');
    if (!node) { clearInterval(cd.timer); if (state._cd === cd) state._cd = null; return; }
    node.textContent = Math.max(0, Math.ceil(target - Date.now() / 1000)) + 's';
  };
  tick();
  cd.timer = setInterval(tick, 1000);
}
function refreshLogs() {
  jreq('/api/logs').then(renderLogs).catch((e) => console.warn('logs:', e));
}
function renderLogs(d) {
  const el = $('logs-body'); if (!el) return;
  const rootEl = $('logs-root'); if (rootEl) rootEl.textContent = d.root ? ('root: ' + d.root) : '';
  if (!d.sessions || !d.sessions.length) {
    el.innerHTML = '<div class="muted small">No sessions yet — data appears after a finished recording.</div>';
    return;
  }
  el.innerHTML = d.sessions.map((s, i) => {
    const files = s.tests.reduce((n, t) => n + Object.keys(t.files || {}).length, 0);
    return '<details' + (i === 0 ? ' open' : '') + '>'
      + '<summary><span class="mono ls-name">' + esc(s.name) + '</span>'
      + '<span class="muted small">' + s.tests.length + ' test · ' + files + ' file</span></summary>'
      + '<table class="log-table"><thead><tr><th>test</th><th>files</th></tr></thead><tbody>'
      + s.tests.map((t) =>
        '<tr><td class="mono">' + esc(t.name) + '</td><td>'
        + Object.entries(t.files || {}).map(([fn, sz]) =>
            '<a class="file-link" href="#" data-rel="' + esc(s.name + '/' + t.name + '/' + fn) + '">' + esc(fn) + '</a>'
            + '<span class="muted small">' + fmtSize(sz) + '</span>'
            + '<a class="dl" href="/api/logs/file?path=' + encodeURIComponent(s.name + '/' + t.name + '/' + fn) + '&amp;dl=1" title="Download">⬇</a>'
          ).join(' ')
        + '</td></tr>'
      ).join('')
      + '</tbody></table></details>';
  }).join('');
  el.querySelectorAll('.file-link').forEach((a) => a.addEventListener('click', (ev) => {
    ev.preventDefault();
    openFile(a.dataset.rel);
  }));
}
function openFile(rel) {
  const m = $('modal'); const body = $('modal-body');
  body.classList.remove('critical');
  $('modal-title').textContent = rel;
  body.textContent = 'Loading…';
  m.classList.add('open');
  fetch('/api/logs/file?path=' + encodeURIComponent(rel)).then(async (r) => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    body.textContent = await r.text();
  }).catch((e) => {
    body.classList.add('critical');
    body.textContent = 'Load error: ' + e.message;
  });
}
async function init() {
  try {
    const lst = await jreq('/api/scenario');
    state.scenarios = lst.scenarios || [];
    state.scenName = '';   // dropdown default: empty placeholder; scenarios load on select / session
    state.scen = null;
  } catch (e) { console.warn('scenarios:', e); }
  try { state.ses = await jreq('/api/session/status'); } catch (e) { console.warn('status:', e); }
  if (state.ses && (state.ses.plan || []).length && state.ses.summary && state.ses.summary.scenario && state.ses.summary.scenario !== state.scenName)
    loadScenario(state.ses.summary.scenario);   // steps from the last session's scenario
  buildLivePanes();
  renderAll(state.ses);
  refreshLogs();
  openStream();
  $('logs-refresh').addEventListener('click', () => refreshLogs());
  const mc = $('modal-close');
  if (mc) mc.addEventListener('click', () => $('modal').classList.remove('open'));
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) $('modal').classList.remove('open'); });
  state.tickT = setInterval(() => Object.keys(state.live).forEach((a) => updateLiveStats(a)), 1000);
  setInterval(() => { if (!document.hidden) sync(); }, 5000);   // foreground rsync (topbar chip rx counters)
  setInterval(() => { if (document.hidden) sync(); }, 10000);   // background rsync
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
}
init();
</script>
</html>
